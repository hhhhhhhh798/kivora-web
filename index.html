<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivora AI Studio</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f3f4f6;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin: 0 0 6px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }
        p.subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 0.88rem;
            margin: 0 0 24px 0;
        }
        textarea {
            width: 100%;
            height: 110px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            resize: none;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: var(--accent-color);
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: var(--accent-hover);
        }
        button:active {
            transform: scale(0.99);
        }
        .output-box {
            margin-top: 24px;
            min-height: 250px;
            background: #0f172a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #334155;
            overflow: hidden;
        }
        .output-box img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }
        .status-text {
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
            padding: 16px;
        }
        .error-text {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KIVORA AI</h1>
        <p class="subtitle">Next-Gen Visual Generation Engine</p>
        
        <textarea id="prompt" placeholder="اكتب وصف الصورة أو المشهد هنا..."></textarea>
        <button onclick="generateImage()">توليد الإبداع 🚀</button>

        <div class="output-box" id="result">
            <span class="status-text">ستظهر النتيجة هنا...</span>
        </div>
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            const resultBox = document.getElementById('result');
            
            if (!prompt) {
                alert('يرجى كتابة وصف أولاً');
                return;
            }

            resultBox.innerHTML = '<span class="status-text">جاري معالجة الطلب عبر Kivora Core Engine...</span>';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (data.success && data.image_url) {
                    const img = new Image();
                    img.src = data.image_url;
                    img.onload = () => {
                        resultBox.innerHTML = `<img src="${data.image_url}" alt="Kivora Output">`;
                    };
                    img.onerror = () => {
                        resultBox.innerHTML = '<span class="status-text error-text">تعذر تحميل الصورة المولدة.</span>';
                    };
                } else {
                    resultBox.innerHTML = `<span class="status-text error-text">${data.error || 'حدث خطأ أثناء توليد الصورة.'}</span>`;
                }
            } catch (err) {
                resultBox.innerHTML = '<span class="status-text error-text">فشل الاتصال بـ Kivora API.</span>';
            }
        }
    </script>
</body>
</html>
