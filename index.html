<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivora AI Studio</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-color: #6366f1;
            --text-color: #f3f4f6;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fff;
        }
        p.subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            box-sizing: border-box;
            resize: none;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .output-box {
            margin-top: 24px;
            min-height: 200px;
            background: #0f172a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #334155;
            overflow: hidden;
        }
        .output-box img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KIVORA AI</h1>
        <p class="subtitle">Next-Gen Visual Generation Engine</p>
        
        <textarea id="prompt" placeholder="اكتب وصف الصورة هنا..."></textarea>
        <button onclick="generateImage()">توليد الإبداع 🚀</button>

        <div class="output-box" id="result">
            <span style="color: #64748b;">ستظهر النتيجة هنا...</span>
        </div>
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const resultBox = document.getElementById('result');
            
            if(!prompt) return alert('يرجى كتابة وصف أولاً');

            resultBox.innerHTML = '<span style="color: #94a3b8;">جاري معالجة طلبك عبر Kivora Engine...</span>';

            // استخدام Pollinations كمحرك مؤقت خفيف بدون مفاتيح
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?nologo=true`;
            
            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                resultBox.innerHTML = `<img src="${imageUrl}" alt="Kivora Output">`;
            };
            img.onerror = () => {
                resultBox.innerHTML = '<span style="color: #ef4444;">حدث خطأ أثناء التوليد.</span>';
            };
        }
    </script>
</body>
</html>
