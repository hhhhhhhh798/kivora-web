<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivora AI Studio</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f3f4f6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin: 0 0 6px 0;
            color: #ffffff;
        }
        p.subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 0.88rem;
            margin: 0 0 20px 0;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            resize: none;
            font-size: 0.95rem;
            outline: none;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }
        .control-group {
            flex: 1;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            outline: none;
            font-size: 0.88rem;
        }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .output-box {
            margin-top: 24px;
            min-height: 250px;
            background: #0f172a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #334155;
            overflow: hidden;
        }
        .output-box img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }
        .status-text {
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KIVORA AI</h1>
        <p class="subtitle">Next-Gen Visual Generation Engine</p>
        
        <textarea id="prompt" placeholder="اكتب وصف الصورة أو المشهد هنا..."></textarea>
        
        <div class="controls">
            <div class="control-group">
                <label>النمط الفني</label>
                <select id="style">
                    <option value="photorealistic">واقعي (Cinematic Photo)</option>
                    <option value="anime">أنيمي (Anime Style)</option>
                    <option value="digital-art">رسم رقمي (Digital Art)</option>
                    <option value="cyberpunk">سايبربانك (Cyberpunk)</option>
                </select>
            </div>
            <div class="control-group">
                <label>الأبعاد</label>
                <select id="ratio">
                    <option value="1024x1024">مربع (1:1)</option>
                    <option value="1280x720">عرضي (16:9)</option>
                    <option value="720x1280">طولي (9:16)</option>
                </select>
            </div>
        </div>

        <button onclick="generateImage()">توليد الإبداع 🚀</button>

        <div class="output-box" id="result">
            <span class="status-text">ستظهر النتيجة هنا...</span>
        </div>
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            const style = document.getElementById('style').value;
            const ratio = document.getElementById('ratio').value.split('x');
            const resultBox = document.getElementById('result');
            
            if (!prompt) return alert('يرجى كتابة وصف أولاً');

            resultBox.innerHTML = '<span class="status-text">جاري معالجة الطلب عبر Kivora Engine...</span>';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        style: style,
                        width: parseInt(ratio[0]),
                        height: parseInt(ratio[1])
                    })
                });

                const data = await response.json();

                if (data.success && data.image_url) {
                    const img = new Image();
                    img.src = data.image_url;
                    img.onload = () => {
                        resultBox.innerHTML = `<img src="${data.image_url}" alt="Kivora Output">`;
                    };
                } else {
                    resultBox.innerHTML = '<span class="status-text" style="color:#ef4444;">حدث خطأ أثناء التوليد.</span>';
                }
            } catch (err) {
                resultBox.innerHTML = '<span class="status-text" style="color:#ef4444;">فشل الاتصال بـ Kivora API.</span>';
            }
        }
    </script>
</body>
</html>
